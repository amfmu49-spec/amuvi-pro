<div id="app" class="amuvi-pro">
  <header class="bar amuvi-header">
    <div class="brand">
      <span class="word amuvi-title">AMUVI PRO</span>
    </div>
    <div class="proj" style="display:none;">
      <input id="songTitle" type="text" placeholder="曲名">
      <input id="songArtist" type="text" placeholder="アーティスト">
    </div>
    <div class="modes" role="group" style="display:none;">
      <button id="modeEasy" aria-pressed="true">かんたん</button>
      <button id="modePro" aria-pressed="false">詳細</button>
    </div>
    <div class="acts" style="display:none;">
      <label class="file"><input id="fileProject" type="file"></label>
      <button id="btnSave">保存</button>
      <button id="btnAE">AE用に書き出し</button>
      <button id="btnTerms" class="ghost terms-open">利用について</button>
    </div>
  </header>

  <main class="work amuvi-main">
    <section class="col col-left amuvi-inputs" aria-label="歌詞とタイミング">
      <div class="amuvi-card">
        <h2 class="amuvi-h2">🎵 オーディオと歌詞</h2>
        
        <div class="amuvi-actions">
           <label class="amuvi-btn file" title="mp3 / wav / m4a など">
             🎵 曲を読み込む
             <input id="audioFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac">
           </label>
           
           <label class="amuvi-btn file" title="SRTファイル">
             📝 SRTを読み込む
             <input id="srtFile" type="file" accept=".srt">
           </label>
           <label class="amuvi-btn file" title="背景画像を設定（リリックモーションが透過されます）">
             🖼 背景画像
             <input id="bgImageFile" type="file" accept="image/*">
           </label>
        </div>
        <div id="bgImageBar" style="display:none; align-items:center; gap:8px; margin-top:4px; font-size:12px; color:#7c3aed; background:#f5f3ff; border-radius:6px; padding:6px 10px;">
          <span>🖼 背景画像：</span><span id="bgImageName" style="font-weight:600; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
          <button id="btnClearBg" style="margin-left:auto; font-size:11px; padding:2px 8px; border:1px solid #7c3aed66; border-radius:4px; background:none; color:#7c3aed; cursor:pointer;">✕ 解除</button>
        </div>
        
        <div id="audioName" class="muted audio-name amuvi-audio-name">曲なし</div>

        <textarea id="srtLyrics" rows="8" spellcheck="false" class="amuvi-textarea" placeholder="ここにSRT形式で入力するか、SRTファイルを読み込んでください"></textarea>
        <textarea id="lyrics" style="display:none;"></textarea>
        
        <div style="margin-top: 16px;">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
            <h3 class="amuvi-h2" style="font-size:16px; margin:0;">⏱ タイムライン</h3>
            <span style="font-size:11px; color:#94a3b8;">← スクロール | ブロックを左右にドラッグでタイミング調整</span>
          </div>
          <div id="amuviDragTimeline" style="overflow-x:auto; background:#1e293b; border-radius:8px; position:relative; height:120px; width:100%; touch-action:pan-x; margin-bottom:12px; box-shadow:inset 0 2px 6px rgba(0,0,0,.4); border:1px solid #334155;">
            <div id="amuviTimelineTrack" style="position:relative; height:100%; min-width:100%;">
              <div id="amuviTimelinePlayhead" style="position:absolute; top:0; bottom:0; width:2px; background:#ff4757; left:0; pointer-events:none; z-index:20;"></div>
            </div>
          </div>
          <span id="linesInfo" style="display:none;"></span>
          <ol id="lineList" style="display:none;"></ol>
        </div>

        <!-- Hidden required elements -->
        <div style="display:none;">
          <button id="btnSyntax"></button>
          <select id="lyricLang"><option value="auto"></option><option value="ja"></option><option value="zh-Hant"></option><option value="zh-Hans"></option><option value="ko"></option><option value="en"></option></select>
          <span id="langNote"></span>
          <div id="syntax"></div>
          <button id="btnTap"></button>
          <input id="bpm" type="number"><input id="offset" type="number"><input id="lineScale" type="number"><input id="snap" type="checkbox"><button id="btnResetTimes"></button>
          <div id="tapPanel"><b id="tapLine"></b><button id="tapBtn"></button><button id="tapStop"></button></div>
        </div>
      </div>
    </section>

    <section class="col col-stage amuvi-preview" aria-label="プレビュー">
      <div class="amuvi-card">
        <div class="viewport" id="viewport" style="position:relative;">
          <div id="bgImageLayer" style="position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0;border-radius:4px;"></div>
          <canvas id="view" width="1280" height="720" style="position:relative;z-index:1;"></canvas>
          <div id="viewMsg" class="overlay-msg" hidden></div>
          <div id="keyBadge" class="key-badge" hidden></div>
          <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="transport amuvi-transport">
          <button id="btnPlay" class="play amuvi-icon-btn" aria-label="再生">▶</button>
          <span id="timeNow" class="tc">00:00.00</span>
          <span class="tc muted">/</span>
          <span id="timeDur" class="tc muted">00:00.00</span>
          <input id="scrub" type="range" min="0" max="10000" value="0" aria-label="再生位置" class="amuvi-slider">
          <button id="btnLoop" class="amuvi-icon-btn ghost small" aria-pressed="true">🔁</button>
          <span class="vol" style="display:none;">
            <button id="btnMute"></button>
            <input id="vol" type="range">
          </span>
          <span class="hist-btns" style="display:none;">
            <button id="btnPrev"></button><button id="btnNext"></button>
          </span>
          <button id="btnShuffle" style="display:none;">シャッフル</button>
          <button id="btnOmakase" style="display:none;">おまかせ</button>
        </div>
        <canvas id="timeline" style="display:none;"></canvas>
        <div class="cutinfo" id="cutInfo" style="display:none;"></div>
      </div>
    </section>

    <section class="col col-right amuvi-controls" aria-label="スタイルと書き出し">
      <div id="easyPanel" class="easy amuvi-card">
        <div class="easy-hero amuvi-hero">
          <button id="btnOmakaseBig" class="omakase amuvi-omakase-btn">✨ AI おまかせ生成 ✨</button>
          <p class="hint amuvi-hint">ワンタップでデザイン・動き・配色を自動生成！</p>
          <div class="hist-row amuvi-hist-row">
            <button id="btnPrev2" class="ghost amuvi-ghost-btn">◀ 前の案</button>
            <span id="histPos" class="muted mono"></span>
            <button id="btnNext2" class="ghost amuvi-ghost-btn">次の案 ▶</button>
          </div>
          <!-- Hidden checkboxes required by JS -->
          <div style="display:none;">
            <input id="eExtra" type="checkbox" checked>
            <input id="eWa" type="checkbox" checked>
          </div>
        </div>

        <div class="easy-sec" style="display:none;">
          <div id="easyNow"></div>
          <button id="eStyle"></button><button id="ePalette"></button><button id="eMood"></button><button id="eCut"></button>
        </div>
        
        <div class="easy-sec amuvi-export-sec">
          <div class="fields amuvi-fields">
            <label class="field">アスペクト比
              <select id="eAspect" class="amuvi-select">
                <option value="9:16">9:16 (縦型)</option>
                <option value="16:9">16:9</option>
                <option value="1:1">1:1</option>
              </select>
            </label>
            <div style="display:none;">
              <select id="eRes"><option value="1080">1080p</option></select>
              <select id="eFps"><option>30</option></select>
              <select id="eKey"><option value="off"></option><option value="green"></option><option value="black"></option></select>
            </div>
          </div>
          <div class="outbtns amuvi-outbtns">
             <button id="eMP4" class="primary amuvi-export-btn">⬇️ MP4 動画を保存</button>
          </div>
          <div class="exp-box amuvi-exp-box" hidden>
            <div class="progress"><i class="exp-bar"></i></div>
            <div class="row amuvi-row-between"><span class="exp-text muted mono amuvi-exp-text">—</span><button class="exp-cancel ghost small amuvi-exp-cancel">中止</button></div>
          </div>
        </div>
      </div>
      
      <!-- ALL PRO TABS HIDDEN -->
      <nav class="tabs" role="tablist" style="display:none;">
        <button role="tab" data-tab="style" aria-selected="true"></button>
        <button role="tab" data-tab="fx" aria-selected="false"></button>
        <button role="tab" data-tab="tech" aria-selected="false"></button>
        <button role="tab" data-tab="out" aria-selected="false"></button>
      </nav>

      <div class="tabpane" data-pane="style" style="display:none;">
        <div id="styleGrid"></div><div id="fontRoles"></div><input id="localFont"><button id="btnAddFont"></button><input id="fontFile" type="file"><input id="accentOn" type="checkbox"><div id="colorRowAccent"></div><button id="btnRandPalette"></button><div id="paletteSwatch"></div><input id="colorOn" type="checkbox"><div id="colorRow"></div>
      </div>
      <div class="tabpane" data-pane="fx" style="display:none;">
        <div id="fxSliders"></div><input id="fxFlash" type="checkbox"><select id="fxKoma"><option value="12"></option><option value="8"></option><option value="0"></option></select><select id="fxHud"><option value="auto"></option></select><input id="seed"><button id="btnSeed"></button>
      </div>
      <div class="tabpane" data-pane="tech" style="display:none;">
        <input id="tExtra" type="checkbox" checked><input id="tWa" type="checkbox" checked><input id="techFilter"><span id="techTotal"></span><div id="techLists"></div>
      </div>
      <div class="tabpane" data-pane="out" style="display:none;">
        <select id="outAspect"><option value="16:9"></option></select><select id="outRes"><option value="1080"></option></select><select id="outFps"><option>30</option></select><select id="outQuality"><option value="standard"></option></select><select id="outKey"><option value="off"></option></select><input id="outAudio" type="checkbox" checked><button id="btnMP4"></button><button id="btnPNG"></button><button id="btnPNGA"></button><button id="btnPNGL"></button>
      </div>
    </section>
  </main>
</div>

<!-- Modal hidden -->
<dialog id="termsDlg" class="terms" style="display:none;">
  <form method="dialog"><h2 id="termsTitle"></h2><button value="close" id="termsCloseBtn"></button></form>
</dialog>
